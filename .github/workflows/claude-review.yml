name: Claude review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Read the diff with `gh pr diff` and the
            PR description with `gh pr view`. The project is described in
            SPEC.md and ARCHITECTURE.md; use them as the reference.

            Check the changes for:
            - Bugs and correctness problems (logic errors, edge cases, error handling)
            - Security issues (injection, secrets, unsafe input handling, permissions)
            - Tests: missing or inadequate test coverage for the changed behaviour

            Be concise and specific: reference file and line, and explain why
            each finding matters. If you find nothing worth flagging, say so.

            Post your review as exactly ONE comment with
            `gh pr comment ${{ github.event.pull_request.number }} --body "..."`.
          claude_args: |
            --allowedTools "Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*)"
